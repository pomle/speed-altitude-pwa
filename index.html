<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />

      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#0a0f1a" />

    <title>GPS Raw - Real-time Speed & Location</title>
    <meta
      name="description"
      content="Real-time GPS tracking with speedometer, altitude, and position accuracy monitoring"
    />
    <meta
      name="keywords"
      content="GPS, tracker, speedometer, location, navigation, altitude"
    />

    <meta property="og:title" content="GPS Raw - Real-time Speed & Location" />
    <meta
      property="og:description"
      content="Real-time GPS tracking with speedometer, altitude, and position accuracy monitoring"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/opengraph-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GPS Raw" />
    <meta
      name="twitter:description"
      content="Real-time GPS tracking with speedometer"
    />
    <meta name="twitter:image" content="/opengraph-image.png" />
  </head>

  <style>
    body {
      background: #0f131a;
      font-family: system-ui, sans-serif;
      display: grid;
      gap: 16px;
      grid-template-rows: auto 1fr auto;
      margin: 24px;
    }

    header,
    footer {
      display: grid;
      gap: 16px;
    }

    header {
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
    }

    footer {
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .card {
      background: #131720;
      border: 1px solid #222a3a;
      border-radius: 16px;
      display: flex;
      gap: 12px;
      padding: 16px;
    }

    .card .icon {
      width: 20px;
    }

    .card label,
    .label {
      color: #94a3b8;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .card .value {
      color: #f8fafc;
      font-size: 20px;
      font-weight: 700;
      line-height: 28px;
    }

    .card .unit {
      color: #94a3b8;
      font-size: 14px;
    }

    main {
      display: flex;
    }

    #speedometer {
      max-width: 448px;
      margin: auto;
    }

    .glow,
    .needle,
    .speedBar {
      transition: all 0.5s;
    }

    @media (max-width: 640px) {
      body {
        margin: 16px;
      }

      header,
      footer {
        gap: 12px;
      }

      footer {
        grid-template-columns: repeat(2, 1fr);
      }

      .card {
        padding: 8px;
      }

      .card label,
      .label {
        font-size: 10px;
      }

      .card .value {
        font-size: 16px;
      }
    }
  </style>

  <body>
    <header>
      <div class="card">
        <img class="icon" src="./icons/vert.svg" />
        <div class="data">
          <label>Latitude</label>
          <div>
            <span id="latitude" class="value">—</span>
            <span class="unit">°</span>
          </div>
        </div>
      </div>

      <div class="card">
        <img class="icon" src="./icons/hori.svg" />
        <div class="data">
          <label>Longitude</label>
          <div>
            <span id="longitude" class="value">—</span>
            <span class="unit">°</span>

          <radialGradient id="speedGlow">

            <stop offset="100%" stop-color="#fff"></stop>

          <filter id="glow">
            <feGaussianBlur

              result="coloredBlur"

            <feMerge>

              <feMergeNode in="SourceGraphic"></feMergeNode>

          <line

          <line

    <footer>
      <div class="card">
        <img class="icon" src="./icons/mount.svg" />
        <div class="data">
          <label>Altitude</label>
          <div>
            <span id="altitude" class="value">—</span>
            <span class="unit">m</span>

      <div class="card">

          <div>

      </div>

      <div class="card">
        <div class="data">

          <div>
            <span id="accuracy-pos" class="value">—</span>
            <span class="unit">m</span>
          </div>
        </div>

      <div class="card">
        <div class="data">
          <label>Altitudinal Accuracy</label>

            <span id="accuracy-alt" class="value">—</span>
            <span class="unit">m</span>
          </div>
        </div>
      </div>
    </footer>
  </body>

  <script>
    const MAX_SPEED = 250;

    function formatValue(value, decimals = 1) {
      return value ? value.toFixed(decimals) : "—";
    }

    function Speedometer(node) {
      const speedNode = node.querySelector(".speed");
      const glowNode = node.querySelector(".glow");
      const needleNode = node.querySelector(".needle");
      const speedBarNode = node.querySelector(".speedBar");

      return {
        setSpeed(speed) {
          const fraction = Math.min(speed / MAX_SPEED, 1);
          const rotation = fraction * 270 - 135;

          speedNode.textContent = speed.toFixed();
          glowNode.setAttribute("opacity", Math.min(fraction, 0.4));
          needleNode.setAttribute("transform", `rotate(${rotation})`);
          speedBarNode.setAttribute("stroke-dashoffset", 415 - 415 * fraction);
        },
      };
    }

    function PositionUI(node) {
      const speedometerNode = node.querySelector("#speedometer");
      const latNode = node.querySelector("#latitude");
      const lonNode = node.querySelector("#longitude");
      const altNode = node.querySelector("#altitude");
      const headNode = node.querySelector("#heading");
      const posAccNode = node.querySelector("#accuracy-pos");
      const altAccNode = node.querySelector("#accuracy-alt");

      const speedometer = new Speedometer(speedometerNode);

      return {
        speedometer,

        setGeo(geo) {
          console.log(geo);
          const coords = geo.coords;
          latNode.textContent = formatValue(coords.latitude, 6);
          lonNode.textContent = formatValue(coords.longitude, 6);
          altNode.textContent = formatValue(coords.altitude, 1);
          headNode.textContent = formatValue(coords.heading, 0);

          posAccNode.textContent = formatValue(coords.accuracy, 0);
          altAccNode.textContent = formatValue(coords.altitudeAccuracy, 0);

          speedometer.setSpeed(coords.speed ?? 0);
        },
      };
    }

    const ui = new PositionUI(document);
    window.ui = ui;

    const watchId = navigator.geolocation.watchPosition(
      ui.setGeo,
      console.warn,
      {
        enableHighAccuracy: true,
        timeout: 5000,
        maximumAge: 0,
      }
    );
  </script>
