  </g>
  <g transform="rotate(-135)" class="transition-transform duration-500 ease-out" style="transform-box: fill-box; transform-origin: center bottom;">
    <line x1="100" y1="100" x2="100" y2="46" stroke="#fffb" stroke-width="1.5" stroke-linecap="round"></line>
    <circle cx="100" cy="46" r="1.5" fill="#00c8ff" filter="url(#glow)"></circle>
  </g>
  <circle cx="100" cy="100" r="8" fill="hsl(var(--secondary))" stroke="#00c8ff" stroke-width="1"></circle>
  <text x="100" y="140" text-anchor="middle" class="fill-foreground font-bold tabular-nums" style="font-size: 28px;">0</text>
  <text x="100" y="152" text-anchor="middle" class="fill-info-label uppercase tracking-wider" style="font-size: 6px;">km/h</text>
