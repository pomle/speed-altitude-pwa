<svg viewBox="0 0 200 200" class="w-full h-full">
  <defs>
    <radialGradient id="outerRing">
      <stop offset="0%" stop-color="hsl(var(--dashboard-gauge))"></stop>
      <stop offset="100%" stop-color="hsl(var(--dashboard-bg))"></stop>
    </radialGradient>
    <linearGradient id="speedGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c8ff"></stop>
      <stop offset="100%" stop-color="hsl(193 100% 70%)"></stop>
    </linearGradient>
    <radialGradient id="speedGlow">
      <stop offset="0%" stop-color="hsl(193 100% 50%)"></stop>
      <stop offset="100%" stop-color="hsla(193, 100%, 50%, 0)"></stop>
    </radialGradient>
    <linearGradient id="needleGradient">
      <stop offset="0%" stop-color="#fff"></stop>
      <stop offset="100%" stop-color="#fff"></stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#outerRing)"></circle>
  <circle cx="100" cy="100" r="90" fill="hsl(var(--dashboard-bg))"></circle>
  <circle cx="100" cy="100" r="70" fill="url(#speedGlow)" opacity="0"></circle>
  <path d="M 38 162 A 88 88 0 1 1 162 162" fill="none" stroke="hsl(var(--gauge-track))" stroke-width="8" stroke-linecap="round" class="transition-all duration-500"></path>
  <path d="M 38 162 A 88 88 0 1 1 162 162" fill="none" stroke="url(#speedGradient)" stroke-width="4" stroke-linecap="round" stroke-dasharray="416" stroke-dashoffset="415" class="transition-all duration-500" filter="url(#glow)"></path>
  <g stroke="hsl(215 20.2% 65.1%)">
