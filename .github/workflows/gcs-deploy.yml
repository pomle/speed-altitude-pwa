name: Deploy to GCS
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - id: "checkout"
        uses: "actions/checkout@v4"

      - uses: "actions/setup-node@v3"
        with:
          node-version: "22.x"

      - run: npm install
      - run: npm run build

      - id: "auth"
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCS_DEPLOY }}"

      - id: "upload-folder"
        uses: "google-github-actions/upload-cloud-storage@v3"
        with:
          path: "dist"
          destination: "gps.pomle.com"
          parent: false


      - id: "set-cache-control"
        uses: "google-github-actions/upload-cloud-storage@v3"
        with:
          path: "dist/index.html"
          destination: "gps.pomle.com/index.html"
          headers: |
            cache-control: no-cache, max-age=0
